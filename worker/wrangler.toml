name = "blocklist-detector"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Workers Free: 10ms CPU per cron trigger, 128MB memory.
# This worker only does HEAD requests, so CPU is ~0 - all the time is network
# wait, which Cloudflare does not bill as CPU. The actual build (224MB download
# + compression) needs ~40x the free memory, so it runs on GitHub Actions and
# is started by repository_dispatch from here.
# 5 minutes: upstream can commit a new crawl at any time (e.g. 14:00 WIB) and
# the operator expects the mirror to pick it up fast. At ~0 ms CPU per tick
# (one small contents-API JSON GET), the cost of */5 over */10 is negligible,
# so freshness wins. GitHub's own `schedule:` is not used for this anywhere:
# measured mean gap 5.1 h on the upstream repo.
# Note: Cron Trigger changes can take up to 15 minutes to propagate to
# Cloudflare's network, so a redeploy does not switch the schedule instantly.
[triggers]
crons = ["*/5 * * * *"]

# State: last-seen etag/last-modified per source, plus dispatch history.
[[kv_namespaces]]
binding = "STATE"
id = "af3c0d930fdb4ae5b141042327fd7340"

[vars]
GITHUB_REPO = "zinrahastia-gif/blocklist-mirror"
# GitHub Releases layout: <base>/<tag>/<asset>. The tag IS the version id, and
# `gh release create --latest` keeps a moving "latest" tag alongside it, so
# consumers can pin a build or always follow the newest one.
PUBLIC_BASE = "https://github.com/zinrahastia-gif/blocklist-mirror/releases/download"

# Set these as secrets, never here:
#   npx wrangler secret put GITHUB_TOKEN     # fine-grained PAT, Contents: read+write
#   npx wrangler secret put WORKER_SECRET    # any random string the build job sends back
